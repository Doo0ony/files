<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дима</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #525659;
    }

    embed, iframe, object {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #ccc;
      font-family: sans-serif;
      text-align: center;
      gap: 16px;
    }

    .fallback a {
      color: #80b3ff;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Попытка 1: embed — лучший способ, работает в большинстве браузеров -->
  <embed id="pdf-embed" src="kp.pdf" type="application/pdf">

  <script>
    // Если embed не сработал — пробуем iframe с Google Docs viewer (на случай мобильных)
    const embed = document.getElementById('pdf-embed');

    // Проверяем через небольшую задержку, отрендерился ли embed
    setTimeout(() => {
      if (embed.offsetWidth === 0 || embed.offsetHeight === 0) {
        showFallback();
      }
    }, 1500);

    function showFallback() {
      document.body.innerHTML = `
        <iframe src="kp.pdf" style="width:100%;height:100%;border:none;display:block;"></iframe>
      `;
    }
  </script>

</body>
</html>
